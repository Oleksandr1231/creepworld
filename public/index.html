<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creepworld — тренажёр аима</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame">
      <canvas id="game" width="1920" height="1080"></canvas>

      <div class="hud">
        <span class="logo">Creepworld</span>
        <span>Время: <b id="time">30.0</b> с</span>
        <span>Очки: <b id="score">0</b></span>
        <span class="user" id="user"></span>
      </div>

      <div id="overlay">
        <h2 id="title">Тренажёр аима</h2>
        <p id="result">Кликай по шарикам как можно быстрее. Чем меньше шарик и быстрее клик, тем больше очков. Раунд длится 30 секунд.</p>
        <p id="saved"></p>
        <button id="btn">Старт</button>
      </div>
    </div>
  </div>

  <section class="board">
    <h2>Рейтинг</h2>
    <p id="empty">Пока никого нет. Стань первым.</p>
    <ol id="rows"></ol>
  </section>

  <script src="game.js"></script>
</body>
</html>
